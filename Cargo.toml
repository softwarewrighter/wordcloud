[package]
name = "wordcloud"
version = "0.1.0"
edition = "2021"
description = "Generate a colored word cloud PNG or SVG from words given on the command line"
license = "MIT"

[[bin]]
name = "wordcloud"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = true
